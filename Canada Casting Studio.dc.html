<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1">
<template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#FBF8F1"></rect><circle cx="50" cy="50" r="22" fill="none" stroke="#C8942A" stroke-width="7"></circle></svg></template>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&amp;family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&amp;family=Jost:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#EFE9DC;}
*{box-sizing:border-box;}
a{color:#8C6418;text-decoration:underline;text-underline-offset:3px;}
a:hover{color:#1E1A14;}
input,select,textarea,button{font:inherit;color:inherit;}
input:focus,select:focus,textarea:focus{outline:2px solid #C8942A;outline-offset:1px;}
::placeholder{color:#A39985;}
@keyframes ccsSpin{to{transform:rotate(360deg)}}
</style>
</helmet>
<div style="min-height:100vh;background:#EFE9DC;font-family:'Jost',sans-serif;color:#1E1A14;display:flex;justify-content:center;align-items:flex-start;padding:{{ outerPad }};">
  <div ref="{{ frameRef }}" style="width:100%;max-width:{{ frameMax }};height:{{ frameH }};overflow-y:{{ frameOverflow }};overflow-x:hidden;background:#FBF8F1;border-radius:{{ frameRadius }};border:{{ frameBorder }};position:relative;">
    <sc-if value="{{ isPublic }}" hint-placeholder-val="{{ true }}">
      <dc-import name="CCS Public" app="{{ app }}" hint-size="100%,900px"></dc-import>
    </sc-if>
    <sc-if value="{{ isOnboard }}">
      <dc-import name="CCS Onboarding" app="{{ app }}" hint-size="100%,900px"></dc-import>
    </sc-if>
    <sc-if value="{{ isCheckout }}">
      <dc-import name="CCS Checkout" app="{{ app }}" hint-size="100%,900px"></dc-import>
    </sc-if>
    <sc-if value="{{ isApp }}">
      <dc-import name="CCS App" app="{{ app }}" hint-size="100%,900px"></dc-import>
    </sc-if>
  </div>

  <sc-if value="{{ toast }}">
    <div style="position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#1E1A14;color:#FBF8F1;padding:12px 18px;border-radius:8px;font-size:14px;z-index:60;display:flex;gap:10px;align-items:center;box-shadow:0 10px 30px rgba(30,26,20,.25);max-width:calc(100vw - 32px);">
      <span style="width:8px;height:8px;border-radius:50%;background:#C8942A;flex:none;"></span>
      <span>{{ toast }}</span>
    </div>
  </sc-if>

  <div style="position:fixed;top:12px;right:12px;z-index:80;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;align-items:center;background:#1E1A14;color:#E9E1CF;padding:8px 10px;border-radius:12px;box-shadow:0 10px 28px rgba(30,26,20,.28);font-size:12px;max-width:calc(100vw - 24px);">
    <span style="font-family:'JetBrains Mono',monospace;letter-spacing:.08em;color:#C8942A;">VARIANTS</span>
    <label style="display:flex;gap:6px;align-items:center;">
      <span style="color:#A39985;">Landing</span>
      <select value="{{ lvCur }}" onChange="{{ pickLV }}" style="background:#2E281F;border:1px solid #4A4234;border-radius:8px;padding:6px 8px;color:#FBF8F1;font-size:12px;">
        <option value="A">A · Editorial</option>
        <option value="B">B · Clean</option>
        <option value="C">C · Cinematic</option>
      </select>
    </label>
    <label style="display:flex;gap:6px;align-items:center;">
      <span style="color:#A39985;">Onboarding</span>
      <select value="{{ ovCur }}" onChange="{{ pickOV }}" style="background:#2E281F;border:1px solid #4A4234;border-radius:8px;padding:6px 8px;color:#FBF8F1;font-size:12px;">
        <option value="A">A · Sidebar steps</option>
        <option value="B">B · Focus, one step</option>
        <option value="C">C · Scenes, one page</option>
      </select>
    </label>
  </div>

  <div style="position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:70;max-width:calc(100vw - 20px);">
    <sc-if value="{{ barOpen }}" hint-placeholder-val="{{ true }}">
      <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:#1E1A14;color:#E9E1CF;padding:8px 10px 8px 14px;border-radius:14px;font-size:12px;box-shadow:0 12px 32px rgba(30,26,20,.3);">
        <span style="font-family:'JetBrains Mono',monospace;letter-spacing:.08em;color:#C8942A;">PROTOTYPE</span>
        <select value="{{ screen }}" onChange="{{ jump }}" style="background:#2E281F;border:1px solid #4A4234;border-radius:8px;padding:6px 8px;color:#FBF8F1;font-size:12px;max-width:200px;">
          <sc-for list="{{ jumpList }}" as="j">
            <option value="{{ j.v }}">{{ j.l }}</option>
          </sc-for>
        </select>
        <div style="display:flex;gap:4px;">
          <sc-for list="{{ devOpts }}" as="o">
            <button onClick="{{ setDevice }}" data-v="{{ o.v }}" style="border:none;cursor:pointer;height:26px;padding:0 9px;border-radius:7px;font-size:12px;background:{{ o.bg }};color:{{ o.fg }};">{{ o.l }}</button>
          </sc-for>
        </div>
        <button onClick="{{ autofill }}" style="border:1px solid #4A4234;background:transparent;color:#E9E1CF;cursor:pointer;height:26px;padding:0 9px;border-radius:7px;font-size:12px;">Autofill</button>
        <button onClick="{{ reset }}" style="border:1px solid #4A4234;background:transparent;color:#E9E1CF;cursor:pointer;height:26px;padding:0 9px;border-radius:7px;font-size:12px;">Reset</button>
        <button onClick="{{ toggleBar }}" title="Hide" style="border:none;background:transparent;color:#A39985;cursor:pointer;height:26px;width:22px;font-size:15px;">×</button>
      </div>
    </sc-if>
    <sc-if value="{{ barClosed }}">
      <button onClick="{{ toggleBar }}" style="border:none;background:#1E1A14;color:#C8942A;cursor:pointer;padding:8px 14px;border-radius:999px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.08em;">PROTOTYPE</button>
    </sc-if>
  </div>
</div>
</x-dc>

  constructor(props) {

    try { s = JSON.parse(localStorage.getItem('ccs-proto-v1') || 'null'); } catch (e) {}
    this.state = s && s.v === 1 ? this.strip(s) : this.preset('guest');
    this.state.toast = '';
    this.frameRef = React.createRef();
  }
  strip(s) {
    const clean = m => { Object.values(m || {}).forEach(x => { if (x) x.url = null; }); };
    clean(s.profile.media); Object.values(s.roles).forEach(r => clean(r.media));
    if (s.pay) s.pay.status = s.pay.status === 'processing' ? 'idle' : s.pay.status;
    return s;
  }
  componentDidMount() {
    const el = this.frameRef.current;
    if (el && window.ResizeObserver) { this.ro = new ResizeObserver(() => this.setState({ w: el.clientWidth })); this.ro.observe(el); }
    if (this.state.screen === 'activated') this.startCountdown();
  }
  componentWillUnmount() { this.ro && this.ro.disconnect(); clearInterval(this.cd); clearTimeout(this.tt); }
  componentDidUpdate() { try { const { toast, w, ...rest } = this.state; localStorage.setItem('ccs-proto-v1', JSON.stringify(rest)); } catch (e) {} }

  C() { return Component.CFG; }

  fake(slot) { const ext = slot.kind === 'video' ? '.mp4' : slot.kind === 'document' ? '.pdf' : '.jpg'; return { name: slot.label.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'') + ext, size: slot.kind === 'video' ? '48.2 MB' : slot.kind === 'document' ? '640 KB' : '3.1 MB', url:null, img:false }; }
  demoProfile() {
    const C = this.C(), p = { email:'priya.anand@gmail.com', phone:'+1 416 555 0138', emailVerified:true, phoneVerified:true, media:{} };
    [...C.f.personal, ...C.f.contact, ...C.f.legal].forEach(x => p[x.k.slice(2)] = x.d);
    C.decl.forEach(x => p[x.k.slice(2)] = true);

  }
  demoRole(key, extra) {
    const C = this.C(), q = C.req[key], r = this.R();
    [...C.f.appearance, ...q.appearanceFields, ...C.f.experience, ...q.expFields].forEach(x => r.data[x.k.slice(2)] = x.d);
    q.decl.forEach(x => r.data[x.k.slice(2)] = true);
    r.data.credits = [{ production:'Northern Line, Season 2', role:'Det. Lena Park (guest)', year:'2025' },{ production:'Harbourfront Bank', role:'Lead, commercial', year:'2024' }];
    [...q.wardrobe, ...q.appearance, ...q.expSlots].filter(s => s.level !== 'optional').forEach(s => r.media[s.id] = this.fake(s));
    r.termsAt = '2026-03-02'; r.step = 6; r.maxStep = 6;
    return Object.assign(r, extra || {});
  }
  preset(kind) {
    const C = this.C(), roles = {};
    C.roles.forEach(r => roles[r.key] = this.R());
    const base = { v:1, screen:'landing', lv:null, ov:null, device:'desktop', barOpen:true, user:null, profile:{ media:{} }, roles, current:'principal', otp:{ sent:false, code:'', err:'' }, terms:{ a:false, b:false, c:false }, pay:{ status:'idle', failNext:false }, castOpen:'c1', castFilter:'mine', interested:{}, threads:JSON.parse(JSON.stringify(C.threads)), threadOpen:'t1', draft:'', count:5, loginAs:'active', authErr:'', savedMode:'resume' };
    const user = { name:'Priya Anand', email:'priya.anand@gmail.com' };
    if (kind === 'guest') return base;
    if (kind === 'new') return { ...base, user, screen:'registerAs', profile:{ firstName:'Priya', lastName:'Anand', email:user.email, phone:'+1 416 555 0138', emailVerified:true, media:{} } };
    const profile = this.demoProfile();
    if (kind === 'progress') {
      const r = this.demoRole('principal', { status:'onboarding', step:3, maxStep:3 });
      r.media = {};
      return { ...base, user, profile, roles:{ ...roles, principal:r }, screen:'resume', savedMode:'resume' };
    }
    if (kind === 'payment') return { ...base, user, profile, roles:{ ...roles, principal:this.demoRole('principal', { status:'ready', confirm:true }) }, screen:'payment' };
    if (kind === 'verifying') return { ...base, user, profile, roles:{ ...roles, principal:this.demoRole('principal', { status:'verifying', confirm:true, appId:'CCS-PA-2609-04817', paidAt:'2026-09-25' }) }, screen:'verifying' };
    return { ...base, user, profile, screen:'home', roles:{ ...roles,
      principal:this.demoRole('principal', { status:'active', confirm:true, appId:'CCS-PA-2603-01122', regDate:'2026-03-14', expiry:'2027-03-13' }),
      background:this.demoRole('background', { status:'expired', confirm:true, appId:'CCS-BG-2408-00391', regDate:'2024-08-02', expiry:'2025-08-01' }) } };
  }

  scrollTop() { try { window.scrollTo(0, 0); } catch (e) {} const el = this.frameRef.current; if (el) el.scrollTop = 0; }
  go(screen, extra) {
    this.setState({ screen, ...(extra || {}) }, () => this.scrollTop());
    if (screen === 'activated') this.startCountdown();
  }
  toast(msg) { clearTimeout(this.tt); this.setState({ toast: msg }); this.tt = setTimeout(() => this.setState({ toast:'' }), 2400); }
  startCountdown() {
    clearInterval(this.cd);
    this.setState({ count:5 });
    this.cd = setInterval(() => {
      if (this.state.screen !== 'activated') { clearInterval(this.cd); return; }
      const n = this.state.count - 1;
      if (n <= 0) { clearInterval(this.cd); this.go('home', { count:0 }); } else this.setState({ count:n });
    }, 1000);
  }
  routeAfterLogin(s) {
    const e = Object.entries(s.roles), has = st => e.find(([, r]) => r.status === st);
    let hit;
    if (has('active')) return { screen:'home' };
    if ((hit = has('verifying'))) return { screen:'verifying', current:hit[0] };
    if ((hit = has('ready'))) return { screen:'payment', current:hit[0] };
    if ((hit = has('onboarding'))) return { screen:'resume', current:hit[0], savedMode:'resume' };
    return { screen:'registerAs' };
  }

  role(s) { s = s || this.state; return s.roles[s.current]; }
  getVal(k, s) { s = s || this.state; const src = k[0] === 'p' ? s.profile : this.role(s).data; return src[k.slice(2)]; }
  setVal(k, v) {
    this.setState(s => {
      if (k[0] === 'p') return { profile:{ ...s.profile, [k.slice(2)]:v } };
      const r = s.roles[s.current];
      return { roles:{ ...s.roles, [s.current]:{ ...r, data:{ ...r.data, [k.slice(2)]:v } } } };
    });
  }
  setMedia(scope, id, file) {
    this.setState(s => {
      if (scope === 'p') return { profile:{ ...s.profile, media:{ ...(s.profile.media || {}), [id]:file } } };
      const r = s.roles[s.current];
      return { roles:{ ...s.roles, [s.current]:{ ...r, media:{ ...r.media, [id]:file } } } };
    });
  }
  patchRole(key, patch) { this.setState(s => ({ roles:{ ...s.roles, [key]:{ ...s.roles[key], ...patch } } })); }

  fieldsFor(step, key) { const C = this.C(), q = C.req[key]; return { personal:C.f.personal, contact:C.f.contact, legal:C.f.legal, wardrobe:[], appearance:[...C.f.appearance, ...q.appearanceFields], experience:[...C.f.experience, ...q.expFields], review:[] }[step]; }
  slotsFor(step, key) { const C = this.C(), q = C.req[key]; return ({ legal:C.idSlots.map(s => ({ ...s, scope:'p' })), wardrobe:q.wardrobe, appearance:q.appearance, experience:q.expSlots })[step] || []; }
  declsFor(step, key) { const C = this.C(); return step === 'legal' ? [...C.decl, ...C.req[key].decl] : []; }
  missing(step, s) {
    s = s || this.state; const key = s.current, out = [];
    const empty = v => v == null || v === '' || (Array.isArray(v) && !v.length);
    this.fieldsFor(step, key).forEach(f => { if (f.req && empty(this.getVal(f.k, s))) out.push(f.label); });
    this.slotsFor(step, key).forEach(sl => { if (sl.level === 'required') { const m = sl.scope === 'p' ? (s.profile.media || {}) : this.role(s).media; if (!m[sl.id]) out.push(sl.label); } });
    this.declsFor(step, key).forEach(d => { if (!this.getVal(d.k, s)) out.push('Declaration'); });
    if (step === 'contact') { if (!s.profile.emailVerified) out.push('Email verification'); if (!s.profile.phoneVerified) out.push('Mobile verification'); }
    if (step === 'review') { const inc = this.C().steps.slice(0, 6).some(x => this.missing(x.key, s).length); if (inc) out.push('Complete all sections'); if (!this.role(s).confirm) out.push('Confirmation'); }
    return out;
  }
  hasOtherRole(s) { return Object.entries(s.roles).some(([k, r]) => k !== s.current && ['verifying','active','expired','paid','ready'].includes(r.status)); }
  taxes(s) {
    const C = this.C(), pv = C.PROVS.find(p => p[1] === s.profile.province), code = pv ? pv[0] : 'ON';
    const lines = (C.tax[code] || [['GST',5]]).map(([n, r]) => ({ label:n + ' ' + r + '%', amt:C.fee * r / 100 }));
    const total = C.fee + lines.reduce((a, l) => a + l.amt, 0);
    const $ = n => 'CAD $' + n.toFixed(2);
    return { province: pv ? pv[1] : 'Ontario', lines: lines.map(l => ({ label:l.label, amt:$(l.amt) })), fee:$(C.fee), total:$(total) };
  }
  fmtDate(iso) { if (!iso) return '—'; const d = new Date(iso + 'T12:00:00'); return d.toLocaleDateString('en-CA', { day:'numeric', month:'short', year:'numeric' }); }

  renderVals() {
    const s = this.state, C = this.C();
    const lv = s.lv || this.props.landingVariant || 'A', ov = s.ov || this.props.onboardingVariant || 'A';
    const mobile = s.device === 'mobile', w = s.w || 1200, narrow = mobile || w < 760;
    const pub = ['landing','signup','login','created','registerAs','terms','resume','saved'];
    const onb = ['onboard'], chk = ['payment','submitted','verifying','activated'];
    const role = this.role(), rc = C.roles.find(r => r.key === s.current), q = C.req[s.current];
    const steps = C.steps.map((st, i) => {
      const miss = this.missing(st.key);
      const reused = st.common && this.hasOtherRole(s);
      const state = i === role.step ? 'current' : (i <= role.maxStep && !miss.length) ? 'done' : i <= role.maxStep ? 'partial' : 'todo';
      return { ...st, i, n: String(i + 1).padStart(2, '0'), missing:miss, missCount:miss.length, reused, state };
    });
    const nav = e => { const to = e.currentTarget.dataset.to; if (to) this.go(to); };
    const opt = (cur, v) => ({ v, bg: cur === v ? '#C8942A' : '#2E281F', fg: cur === v ? '#1E1A14' : '#E9E1CF' });
    const jumps = [['landing','Landing'],['signup','Sign up'],['login','Log in'],['created','Account created'],['registerAs','Register as'],['terms','Terms & conditions'],['resume','Continue registration'],['onboard','Onboarding'],['payment','Payment'],['submitted','Registration submitted'],['verifying','Verification'],['activated','Profile activated'],['home','Home'],['registrations','My registrations'],['casting','Casting calls'],['castingDetail','Casting call detail'],['messages','Messages']];
    const presetFor = { created:'new', registerAs:'new', terms:'new', resume:'progress', onboard:'progress', payment:'payment', submitted:'verifying', verifying:'verifying', activated:'active', home:'active', registrations:'active', casting:'active', castingDetail:'active', messages:'active' };

    const app = {
      screen:s.screen, lv, ov, narrow, mobile, cfg:C, user:s.user, profile:s.profile, roles:s.roles, current:s.current, role, roleCfg:rc, req:q,
      steps, step:steps[role.step], otp:s.otp, terms:s.terms, pay:s.pay, taxes:this.taxes(s), castOpen:s.castOpen, castFilter:s.castFilter, interested:s.interested,
      threads:s.threads, threadOpen:s.threadOpen, draft:s.draft, count:s.count, loginAs:s.loginAs, authErr:s.authErr, savedMode:s.savedMode,
      fmtDate:d => this.fmtDate(d), fieldsFor:(st) => this.fieldsFor(st, s.current), slotsFor:(st) => this.slotsFor(st, s.current), declsFor:(st) => this.declsFor(st, s.current), getVal:k => this.getVal(k),
      nav, go:(x, e) => this.go(x, e), toast:m => this.toast(m),
      onField: e => { const t = e.currentTarget; this.setVal(t.dataset.k, t.type === 'checkbox' ? t.checked : t.value); },
      onChip: e => { const { k, v } = e.currentTarget.dataset; const cur = this.getVal(k) || []; this.setVal(k, cur.includes(v) ? cur.filter(x => x !== v) : [...cur, v]); },
      onUpload: e => { const t = e.currentTarget, f = t.files && t.files[0]; if (!f) return; const img = /^image\//.test(f.type); this.setMedia(t.dataset.scope, t.dataset.slot, { name:f.name, size:(f.size / 1048576).toFixed(1) + ' MB', url:img ? URL.createObjectURL(f) : null, img }); t.value = ''; this.toast('Uploaded ' + f.name); },
      onSample: e => { const { scope, slot } = e.currentTarget.dataset; const sl = this.slotsFor(this.C().steps[role.step].key === 'review' ? 'appearance' : this.C().steps[role.step].key, s.current).find(x => x.id === slot) || { label:slot, kind:'photo' }; this.setMedia(scope, slot, this.fake(sl)); },
      onRemove: e => { const { scope, slot } = e.currentTarget.dataset; this.setMedia(scope, slot, null); },
      onCredit: e => { const { i, f } = e.currentTarget.dataset; const cr = [...(role.data.credits || [])]; cr[+i] = { ...cr[+i], [f]:e.currentTarget.value }; this.setVal('r.credits', cr); },
      addCredit: () => this.setVal('r.credits', [...(role.data.credits || []), { production:'', role:'', year:'' }]),
      removeCredit: e => { const i = +e.currentTarget.dataset.i; this.setVal('r.credits', (role.data.credits || []).filter((_, j) => j !== i)); },
      sendOtp: () => { if (!s.profile.phone) { this.setState({ otp:{ ...s.otp, err:'Enter your mobile number first.' } }); return; } this.setState({ otp:{ sent:true, code:'', err:'' } }); this.toast('Code sent to ' + s.profile.phone); },
      onOtp: e => this.setState({ otp:{ ...s.otp, code:e.currentTarget.value.replace(/\D/g, '').slice(0, 6), err:'' } }),
      verifyOtp: () => { if (s.otp.code.length !== 6) { this.setState({ otp:{ ...s.otp, err:'Enter the 6-digit code.' } }); return; } this.setState({ profile:{ ...s.profile, phoneVerified:true }, otp:{ sent:false, code:'', err:'' } }); this.toast('Mobile number verified'); },
      changePhone: () => this.setState({ profile:{ ...s.profile, phoneVerified:false } }),
      verifyEmail: () => { this.setState({ profile:{ ...s.profile, emailVerified:true } }); this.toast('Email verified'); },
      signUp: () => { const p = s.profile; if (!p.firstName || !p.email) { this.setState({ authErr:'Enter your name and email to continue.' }); return; } this.setState({ user:{ name:p.firstName + ' ' + (p.lastName || ''), email:p.email }, authErr:'' }); this.go('created'); },
      setLoginAs: e => this.setState({ loginAs:e.currentTarget.dataset.v }),
      login: () => { const n = this.preset(s.loginAs); const r = this.routeAfterLogin(n); this.setState({ ...n, lv:s.lv, ov:s.ov, device:s.device, barOpen:s.barOpen, ...r }, () => this.scrollTop()); this.toast('Signed in as Priya Anand'); },
      logout: () => { this.setState({ ...this.preset('guest'), lv:s.lv, ov:s.ov, device:s.device }); this.scrollTop(); },
      pickRole: e => {
        const k = e.currentTarget.dataset.role, r = s.roles[k];
        if (!s.user) { this.setState({ current:k }); this.go('signup'); return; }
        if (r.status === 'expired') { this.setState({ current:k, roles:{ ...s.roles, [k]:{ ...r, status:'ready', step:6, maxStep:6, confirm:false, renewing:true } } }); this.go('onboard'); return; }
        if (r.status === 'onboarding') { this.setState({ current:k }); this.go('onboard'); return; }
        if (r.status !== 'none') { this.setState({ current:k }); this.go('registrations'); return; }
        this.setState({ current:k, terms:{ a:false, b:false, c:false } }); this.go('terms');
      },
      toggleTerm: e => { const k = e.currentTarget.dataset.k; this.setState({ terms:{ ...s.terms, [k]:!s.terms[k] } }); },
      acceptTerms: () => { if (!(s.terms.a && s.terms.b && s.terms.c)) return; this.patchRole(s.current, { status:'onboarding', termsAt:'2026-09-25', step:0, maxStep:0 }); this.go('onboard'); },
      declineTerms: () => { this.go('registerAs'); this.toast('You need to accept the terms to register for this role.'); },
      next: () => {
        const r = role;
        if (r.step < 6) { const n = r.step + 1; this.patchRole(s.current, { step:n, maxStep:Math.max(r.maxStep, n) }); this.scrollTop(); this.toast('Saved. ' + C.steps[r.step].title + ' complete.'); return; }
        if (this.missing('review').length) { this.toast('Complete the highlighted items before continuing.'); return; }
        if (r.editing) { this.patchRole(s.current, { editing:false }); this.go('registrations'); this.toast(rc.name + ' profile updated'); return; }
        this.patchRole(s.current, { status:'ready' }); this.go('payment', { pay:{ status:'idle', failNext:s.pay.failNext } });
      },
      back: () => { if (role.step === 0) { this.go(role.editing ? 'registrations' : 'registerAs'); return; } this.patchRole(s.current, { step:role.step - 1 }); this.scrollTop(); },
      toStep: e => { const n = +e.currentTarget.dataset.step; if (n <= role.maxStep || role.editing) { this.patchRole(s.current, { step:n, maxStep:Math.max(role.maxStep, n) }); if (ov !== 'C') this.scrollTop(); } },
      saveExit: () => { this.go(role.editing ? 'registrations' : 'saved', { savedMode:'saved' }); this.toast('Progress saved'); },
      toggleConfirm: () => this.patchRole(s.current, { confirm:!role.confirm }),
      payNow: () => {
        this.setState({ pay:{ ...s.pay, status:'processing' } });
        setTimeout(() => {
          if (this.state.pay.failNext) { this.setState({ pay:{ ...this.state.pay, status:'failed' } }); return; }
          const id = 'CCS-' + rc.code + '-2609-' + String(Math.floor(10000 + Math.random() * 89999));
          this.patchRole(s.current, { status:'verifying', appId:id, paidAt:'2026-09-25', renewing:false });
          this.setState({ pay:{ status:'success', failNext:false } }); this.go('submitted');
        }, 1600);
      },
      retryPay: () => this.setState({ pay:{ ...s.pay, status:'idle' } }),
      toggleFail: () => this.setState({ pay:{ ...s.pay, failNext:!s.pay.failNext } }),
      approve: () => { this.patchRole(s.current, { status:'active', regDate:'2026-09-25', expiry:'2027-09-24' }); this.go('activated'); },
      skipCountdown: () => { clearInterval(this.cd); this.go('home'); },
      openCast: e => this.go('castingDetail', { castOpen:e.currentTarget.dataset.id }),
      setCastFilter: e => this.setState({ castFilter:e.currentTarget.dataset.v }),
      interest: e => { const id = e.currentTarget.dataset.id; this.setState({ interested:{ ...s.interested, [id]:!s.interested[id] } }); if (!s.interested[id]) this.toast('Interest sent. Casting will contact you through Messages if they want to proceed.'); },
      openThread: e => { const id = e.currentTarget.dataset.id; this.setState({ threadOpen:id, threads:s.threads.map(t => t.id === id ? { ...t, unread:false } : t) }); },
      closeThread: () => this.setState({ threadOpen:null }),
      onDraft: e => this.setState({ draft:e.currentTarget.value }),
      send: () => { if (!s.draft.trim()) return; this.setState({ draft:'', threads:s.threads.map(t => t.id === s.threadOpen ? { ...t, msgs:[...t.msgs, { me:true, t:'Just now', body:s.draft.trim() }] } : t) }); },
      updateRole: e => { const k = e.currentTarget.dataset.role; this.setState({ current:k, roles:{ ...s.roles, [k]:{ ...s.roles[k], editing:true, step:3, maxStep:6 } } }); this.go('onboard'); },
      continueRole: e => { const k = e.currentTarget.dataset.role; this.setState({ current:k }); const st = s.roles[k].status; this.go(st === 'onboarding' ? 'onboard' : st === 'ready' ? 'payment' : st === 'verifying' ? 'verifying' : 'registrations'); },
      renew: e => { const k = e.currentTarget.dataset.role; this.setState({ current:k, roles:{ ...s.roles, [k]:{ ...s.roles[k], status:'ready', step:6, maxStep:6, confirm:false, renewing:true } } }); this.go('onboard'); }
    };

    return {
      app, screen:s.screen, toast:s.toast, frameRef:this.frameRef,
      isPublic:pub.includes(s.screen), isOnboard:onb.includes(s.screen), isCheckout:chk.includes(s.screen), isApp:!pub.includes(s.screen) && !onb.includes(s.screen) && !chk.includes(s.screen),
      outerPad: mobile ? '24px 12px 110px' : '0', frameMax: mobile ? '390px' : 'none', frameH: mobile ? '844px' : 'auto', frameOverflow: mobile ? 'auto' : 'visible',
      frameRadius: mobile ? '28px' : '0', frameBorder: mobile ? '8px solid #1E1A14' : 'none',
      barOpen:s.barOpen, barClosed:!s.barOpen, toggleBar:() => this.setState({ barOpen:!s.barOpen }),
      jumpList:jumps.map(([v, l]) => ({ v, l })),
      jump: e => { const v = e.currentTarget.value, p = presetFor[v]; const base = p ? this.preset(p) : {}; this.setState({ ...base, lv:s.lv, ov:s.ov, device:s.device, barOpen:true, screen:v, pay:{ status:'idle', failNext:false } }, () => this.scrollTop()); if (v === 'activated') this.startCountdown(); },
      lvCur:lv, ovCur:ov,
      pickLV: e => this.setState({ lv:e.currentTarget.value, screen:'landing' }, () => this.scrollTop()),
      pickOV: e => { const v = e.currentTarget.value; if (s.screen !== 'onboard') { const n = this.preset('progress'); this.setState({ ...n, lv:s.lv, ov:v, device:s.device, screen:'onboard' }, () => this.scrollTop()); } else this.setState({ ov:v }); },
      devOpts:[['desktop','Desktop'],['mobile','Mobile']].map(([v, l]) => ({ v, l, ...opt(s.device, v) })),
      setLV: e => this.setState({ lv:e.currentTarget.dataset.v, screen:'landing' }, () => this.scrollTop()),
      setOV: e => { const v = e.currentTarget.dataset.v; if (s.screen !== 'onboard') { const n = this.preset('progress'); this.setState({ ...n, lv:s.lv, ov:v, device:s.device, screen:'onboard' }, () => this.scrollTop()); } else this.setState({ ov:v }); },
      setDevice: e => this.setState({ device:e.currentTarget.dataset.v }),
      autofill: () => { const p = this.demoProfile(), cur = s.roles[s.current], d = this.demoRole(s.current); this.setState({ user:s.user || { name:'Priya Anand', email:p.email }, profile:p, roles:{ ...s.roles, [s.current]:{ ...cur, data:d.data, media:{ ...d.media, ...cur.media } } } }); this.toast('Demo data filled in'); },
      reset: () => { this.setState({ ...this.preset('guest'), lv:s.lv, ov:s.ov, device:s.device }); this.scrollTop(); }
    };
  }
